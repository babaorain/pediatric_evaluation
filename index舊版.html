<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小兒發展里程碑快速評估</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-zinc-50 min-h-screen text-zinc-900 p-4 md:p-8">

    <div class="max-w-[1600px] mx-auto" x-data="pedApp()" x-cloak>
        <header class="mb-8 text-center flex flex-col items-center">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-zinc-900">小兒發展里程碑快速評估</h1>
            <p class="text-zinc-500 mt-2">Pediatric Milestone Assessment Tool</p>
            <p class="text-[11px] text-zinc-400 mt-1">參考來源：國民健康署兒童發展連續圖（50% 時程）；CDC 2022 Learn the Signs. Act Early. (75% 時程)</p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
            <!-- Left Panel -->
            <div class="xl:col-span-3 space-y-6">
                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 text-zinc-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        基本狀態評估
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">評估年齡</label>
                            <select x-model="selectedAge" @change="onAgeChange()"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <template x-for="age in ages" :key="age">
                                    <option :value="age" x-text="ageLabel(age)"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">進入診間方式</label>
                            <select x-model="entryMethod" @change="updateReports()"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <option value="自行走入診間">自行走入診間</option>
                                <option value="由父母抱入診間">由父母抱入診間</option>
                                <option value="坐推車進入診間">坐推車進入診間</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">情緒與專注力</label>
                            <select x-model="emotionState" @change="updateReports()"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <option value="情緒及專注力可">情緒及專注力可</option>
                                <option value="易分心">易分心</option>
                                <option value="情緒及專注力佳">情緒及專注力佳</option>
                                <option value="哭鬧難安撫">哭鬧難安撫</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 全部重置按鈕 -->
                <div class="flex justify-end">
                    <button @click="toggleAll()"
                        class="text-sm px-3 py-1.5 bg-white text-zinc-600 border border-zinc-200 rounded-lg hover:bg-zinc-50 hover:text-rose-600 transition-colors flex items-center gap-1.5 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        全部重置為未測
                    </button>
                </div>

                <!-- 各領域獨立卡片 -->
                <template x-for="(domainName, domainKey) in domainNames" :key="domainKey">
                    <div class="bg-white p-5 sm:p-6 rounded-xl border border-zinc-200 shadow-sm">
                        <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-200">
                            <h2 class="text-lg sm:text-xl font-bold text-zinc-900 flex items-center gap-2">
                                <span class="w-1.5 h-6 bg-zinc-800 rounded-full inline-block"></span>
                                <span x-text="domainName"></span>
                            </h2>
                        </div>
                        <div class="space-y-3">
                            <template x-for="age in ages" :key="age">
                                <div class="border rounded-lg overflow-hidden transition-colors"
                                    :class="age === selectedAge ? 'border-zinc-400 ring-1 ring-zinc-200' : 'border-zinc-200'">
                                    <div class="px-3 py-2.5 text-left flex justify-between items-center transition-colors cursor-pointer"
                                        :class="age === selectedAge ? 'bg-zinc-50' : 'bg-white hover:bg-zinc-50'"
                                        @click.self="toggleAccordion(domainKey, age)">
                                        <div class="flex items-center gap-2 pointer-events-none">
                                            <span class="text-sm font-semibold"
                                                :class="age === selectedAge ? 'text-zinc-900' : 'text-zinc-600'"
                                                x-text="ageLabel(age)"></span>
                                            <span x-show="age === selectedAge"
                                                class="text-[10px] bg-zinc-800 text-white px-2 py-0.5 rounded-full font-medium tracking-wide">基準年齡</span>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <div class="flex gap-1 items-center"
                                                x-show="isAccordionOpen(domainKey, age)">
                                                <button @click.stop="setTargetItemAll(domainKey, age, 'pass')"
                                                    title="本頁全達標"
                                                    class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(O)</button>
                                                <button @click.stop="setTargetItemAll(domainKey, age, 'nt')"
                                                    title="本頁全未測"
                                                    class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(-)</button>
                                                <button @click.stop="setTargetItemAll(domainKey, age, 'fail')"
                                                    title="本頁全未達"
                                                    class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(X)</button>
                                            </div>
                                            <button @click="toggleAccordion(domainKey, age)"
                                                class="p-1 hover:bg-black/5 rounded text-zinc-400">
                                                <svg class="w-4 h-4 transition-transform duration-200"
                                                    :class="isAccordionOpen(domainKey, age) ? 'rotate-180' : ''"
                                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div x-show="isAccordionOpen(domainKey, age)" x-collapse
                                        class="p-3 sm:p-5 bg-zinc-50/50 space-y-3 sm:space-y-4 border-t border-zinc-100 rounded-b-lg">
                                        <template x-for="(item, index) in milestoneData[age][domainKey]" :key="index">
                                            <div
                                                class="flex items-center justify-between gap-3 p-3 sm:p-4 bg-white hover:bg-zinc-50 rounded-xl border border-zinc-200 shadow-sm transition-all group">
                                                <div class="flex-1">
                                                    <span
                                                        class="text-sm sm:text-[15px] text-zinc-700 font-medium group-hover:text-zinc-900 transition-colors"
                                                        x-text="item"></span>
                                                </div>
                                                <div class="flex-shrink-0 inline-flex rounded-lg shadow-sm"
                                                    role="group">
                                                    <button @click="setTargetItem(domainKey, age, item, 'pass')"
                                                        class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-l-md border border-zinc-200 transition-colors focus:z-10 focus:ring-2 focus:ring-zinc-800"
                                                        :class="assessments[domainKey][age][item] === 'pass' ? 'bg-zinc-800 text-white border-zinc-800 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">達標(O)</button>
                                                    <button @click="setTargetItem(domainKey, age, item, 'nt')"
                                                        class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold border-y border-zinc-200 transition-colors focus:z-10 focus:ring-2 focus:ring-zinc-800"
                                                        :class="assessments[domainKey][age][item] === 'nt' ? 'bg-zinc-100 text-zinc-500 border-zinc-200 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">未測(-)</button>
                                                    <button @click="setTargetItem(domainKey, age, item, 'fail')"
                                                        class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-r-md border border-zinc-200 transition-colors focus:z-10 focus:ring-2 focus:ring-zinc-800"
                                                        :class="assessments[domainKey][age][item] === 'fail' ? 'bg-rose-50 text-rose-700 border-rose-200 ring-1 ring-inset ring-rose-300 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">未達(X)</button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Right Panel -->
            <div class="xl:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                        <h2 class="text-lg font-semibold text-zinc-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                            1. 病歷 Objective 內容
                        </h2>
                        <div class="flex gap-2">
                            <button @click="regenerateObjective()" x-show="objectiveEdited" x-cloak
                                class="text-sm px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors flex items-center gap-1.5 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                                有修改，重新產生
                            </button>
                            <button @click="copyText(objectiveText, 'btn1')" id="btn1"
                                class="text-sm px-3 py-1.5 bg-white border border-zinc-200 text-zinc-600 rounded-lg hover:bg-zinc-50 transition-colors flex items-center gap-1.5 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                    </path>
                                </svg>
                                複製
                            </button>
                        </div>
                    </div>
                    <textarea x-model="objectiveText" @input="objectiveEdited = true"
                        class="w-full min-h-[280px] p-4 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-800 leading-relaxed resize-y focus:bg-white focus:ring-2 focus:ring-zinc-800 transition-colors outline-none"></textarea>
                </div>

                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                        <h2 class="text-lg font-semibold text-zinc-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                </path>
                            </svg>
                            2. 聯合評估統合報告 (敘述型)
                        </h2>
                        <div class="flex gap-2">
                            <button @click="regenerateSummary()" x-show="summaryEdited" x-cloak
                                class="text-sm px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors flex items-center gap-1.5 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                                有修改，重新產生
                            </button>
                            <button @click="copyText(summaryText, 'btn2')" id="btn2"
                                class="text-sm px-3 py-1.5 bg-white border border-zinc-200 text-zinc-600 rounded-lg hover:bg-zinc-50 transition-colors flex items-center gap-1.5 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                    </path>
                                </svg>
                                複製
                            </button>
                        </div>
                    </div>
                    <textarea x-model="summaryText" @input="summaryEdited = true"
                        class="w-full min-h-[280px] p-4 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-800 leading-relaxed resize-y focus:bg-white focus:ring-2 focus:ring-zinc-800 transition-colors outline-none"></textarea>
                    <div class="mt-3 text-right">
                        <span class="text-[11px] font-medium px-2 py-1 rounded"
                            :class="summaryText.length > 500 ? 'bg-red-50 text-red-600' : 'bg-transparent text-zinc-400'">
                            字數：<span x-text="summaryText.length"></span> / 500
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== 重整後的里程碑資料 ======
        // 主要參考：衛福部國健署兒童發展連續圖（50% 時程）
        // 輔助參考：CDC 2022 Learn the Signs. Act Early. (75% 時程)
        // 嚴格去重：同一概念只在一個年齡出現
        const milestoneData = {
            // ========== 4 個月 ==========
            "0.33": {
                gross: [

            // ========== 24 個月 / 2 歲 ==========
            "2": {
                gross: [

            "2.5": {
                gross: [
                    "不扶東西雙腳同時離地跳",

                        this.objectiveEdited = false;
                        this.summaryEdited = false;
                    }
                    this.openAccordions = {};

                            this.openAccordions[domainKey][age] = (age === this.selectedAge);

                            items.forEach(item => {
                                if (shouldReset) {

                        "理解你的、我的": "尚未完全理解你的、我的之概念",
                        "說出 4–5 個單字的句子": "尚無法說出 4–5 個單字的句子",
                        "幼兒說話大部分可被外人理解": "口語表達尚難以被多數人理解",
                        "會自己穿衣服（套頭、套手）": "尚無法自行套頭穿衣",
                        "白天不尿褲子": "白天仍偶有尿褲子情形",
                        "與同伴一起玩（輪流概念開始）": "尚缺乏與同伴輪流共玩的概念",
                        "會自己洗手並擦乾": "尚無法獨立完成洗手與擦乾",

                        // 48 個月
                        "單腳連續跳 3–5 下": "尚無法單腳連續跳 3 下以上",
                        "單腳站立 5 秒": "單腳站立尚無法維持 5 秒",
                        "下樓梯可交換腳": "下樓梯尚無法兩腳輪替前進",
                        "過肩投擲球": "尚不會過肩投擲球的動作",
                        "可跳遠 30–45 公分": "原地跳遠尚不及 30 公分",
                        "模仿畫十字與正方形": "尚無法仿畫十字與正方形",
                        "畫人有 2–3 個可辨識部位": "尚無法畫出 2–3 個可辨識部位的人像",
                        "會用兒童剪刀剪紙（直線）": "尚無法使用兒童剪刀沿直線剪紙",
                        "拇指對指動作": "尚無法順暢作拇指對指的動作",
                        "可解開鈕扣": "依然無法獨立解開鈕扣",
                        "數數 1–4": "尚無法順利從 1 數到 4",
                        "辨認紅、黃、綠等基本顏色": "對基本顏色辨認尚不熟練",
                        "使用疑問句（誰、什麼、哪裡）": "尚不善於使用疑問句進行探索",
                        "理解空間概念（裡外上下）": "對裡外上下空間概念尚不熟悉",
                        "能依指示拿取 3 個以內物品": "尚無法依指示準確拿取 3 個以內物品",
                        "會自己穿襪子": "尚無法自行穿好襪子",
                        "用牙刷刷牙": "尚無法獨立使用牙刷刷牙",
                        "進行假扮遊戲（imaginary play）": "尚未發展出明確的假扮遊戲",
                        "懂得與同伴分享": "與同伴分享的社交技巧尚不足",

                        // 60 個月
                        "單腳站立 10 秒": "單腳站立尚無法維持 10 秒",
                        "腳跟接腳尖向前走 2–3 步（tandem walk）": "尚無法以腳跟接腳尖方式向前走",
                        "做小跳步（skipping）": "尚不會做小跳步（skipping）",
                        "可雙腳跳遠 45 公分以上": "雙腳跳遠尚不及 45 公分",
                        "不需牽扶可自行上下樓梯": "上下樓梯仍需牽扶",
                        "模仿畫正三角形": "尚無法模仿畫出三角形",
                        "畫人至少 4–6 個可辨識部位": "尚無法畫出 4 個以上可辨識部位的人像",
                        "熟練使用剪刀沿線剪紙": "使用剪刀沿線剪紙尚不熟練",
                        "模仿寫出簡單文字或數字": "尚無法模仿寫出簡單文字或數字",
                        "數數 1–10": "尚無法流利從 1 數到 10",
                        "說出 8–10 個單字的句子": "尚無法說出 8–10 個單字的長句",
                        "覆誦 5 個阿拉伯數字（如 96257）": "尚無法覆誦 5 個阿拉伯數字",
                        "能說出器官功能（眼睛看、嘴巴吃）": "尚無法清楚說明基本器官功能",
                        "說出兩種常見物品的用途": "尚無法說出兩種常見物品的用途",
                        "描述日常發生的事情": "尚缺乏敘述日常事件的組織能力",
                        "會拉拉鍊、解扣子": "拉拉鍊、解扣子尚不熟練",
                        "遵守團體遊戲規則（如捉迷藏）": "團體遊戲時尚難遵守規則",
                        "會自己用牙刷刷牙、洗臉": "尚無法獨立完成刷牙與洗臉",
                        "對同伴情緒有同理反應": "對同伴情緒的同理反應尚少"
                    };

                    // Fallback：對應不到字典的項目，採通用前綴
                    const toFailPhrase = (item) => {
                        if (failPhrases[item]) return failPhrases[item];
                        return '尚未達成「' + item + '」';
                    };

                    const formatNarrative = (domainName, domainKey, verbCan) => {
                        const passed = [];
                        const failed = [];

                        this.ages.forEach(age => {
                            const items = milestoneData[age][domainKey] || [];
                            items.forEach(item => {
                                const state = this.assessments[domainKey][age][item];
                                if (state === 'pass') passed.push(item);
                                if (state === 'fail') failed.push(item);
                            });
                        });

                        if (passed.length === 0 && failed.length === 0) return '';

                        let line = `${domainName}方面：`;

                        if (failed.length === 0) {
                            line += `目前${verbCan}${passed.join('、')}。`;
                            return line;
                        }

                        if (passed.length > 0) {
                            line += `目前${verbCan}${passed.join('、')}`;
                        }
                        if (failed.length > 0) {
                            if (passed.length > 0) line += '；';
                            const failedParts = failed.map(toFailPhrase);
                            line += '目前' + failedParts.join('、');
                        }
                        line += '。';
                        return line;
                    };

                    const grossDesc = formatNarrative('粗大動作', 'gross', '可');
                    if (grossDesc) parts.push(grossDesc);

                    const fineDesc = formatNarrative('精細動作', 'fine', '可');
                    if (fineDesc) parts.push(fineDesc);

                    const langDesc = formatNarrative('語言', 'lang', '可');
                    if (langDesc) parts.push(langDesc);

                    const socialDesc = formatNarrative('情緒互動及日常生活', 'social', '可自己');
                    if (socialDesc) parts.push(socialDesc);

                    return parts.join('\n');
                },

                copyText(text, btnId) {
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = document.getElementById(btnId);
                        const originalText = btn.innerHTML;
                        btn.innerHTML = `<svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-700">已複製</span>`;
                        btn.classList.add('bg-green-50', 'border-green-200');
                        btn.classList.remove('bg-white', 'border-zinc-200');
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.classList.remove('bg-green-50', 'border-green-200');
                            btn.classList.add('bg-white', 'border-zinc-200');
                        }, 2000);
                    });
                }
            }));
        });
    </script>
</body>
