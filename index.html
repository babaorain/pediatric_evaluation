<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小兒發展里程碑快速評估</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="bg-zinc-50 min-h-screen text-zinc-900 p-4 md:p-8">

    <div class="max-w-5xl mx-auto" x-data="pedApp()" x-cloak>
        <header class="mb-8 text-center flex flex-col items-center">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-zinc-900">小兒發展里程碑快速評估</h1>
            <p class="text-zinc-500 mt-2">Pediatric Milestone Assessment Tool</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Left Panel -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 text-zinc-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        基本狀態評估
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">評估年齡</label>
                            <select x-model="selectedAge" @change="onAgeChange()"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <template x-for="age in ages" :key="age">
                                    <option :value="age" x-text="age + ' 歲'"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">進入診間方式</label>
                            <select x-model="entryMethod"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <option value="自行走入診間">自行走入診間</option>
                                <option value="由父母抱入診間">由父母抱入診間</option>
                                <option value="坐推車進入診間">坐推車進入診間</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-700 mb-1">情緒與專注力</label>
                            <select x-model="emotionState"
                                class="w-full rounded-md border-zinc-300 shadow-sm focus:border-zinc-800 focus:ring-zinc-800 bg-white p-2 border">
                                <option value="情緒及專注力可">情緒及專注力可</option>
                                <option value="易分心">易分心</option>
                                <option value="情緒及專注力佳">情緒及專注力佳</option>
                                <option value="哭鬧難安撫">哭鬧難安撫</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 flex-1 rounded-xl border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                        <h2 class="text-lg font-semibold text-zinc-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                                </path>
                            </svg>
                            發展指標勾選
                        </h2>
                        <button @click="toggleAll()"
                            class="text-sm px-3 py-1.5 bg-white text-zinc-600 border border-zinc-200 rounded-lg hover:bg-zinc-50 hover:text-rose-600 transition-colors flex items-center gap-1.5 shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            全部重置為未測
                        </button>
                    </div>
                    <div class="space-y-8 max-h-[550px] overflow-y-auto pr-2">
                        <template x-for="(domainName, domainKey) in domainNames" :key="domainKey">
                            <div class="space-y-3">
                                <h3 class="font-bold text-zinc-900 border-b border-zinc-200 pb-2 text-lg flex items-center gap-2">
                                    <span class="w-1.5 h-5 bg-zinc-800 rounded-full inline-block"></span>
                                    <span x-text="domainName"></span>
                                </h3>
                                <div class="bg-white rounded-xl p-3 sm:p-4 border border-zinc-200 shadow-sm">
                                    <div class="space-y-3">
                                        <template x-for="age in ages" :key="age">
                                            <div class="border rounded-lg overflow-hidden transition-colors"
                                                 :class="age === selectedAge ? 'border-zinc-400 ring-1 ring-zinc-200' : 'border-zinc-200'">
                                                <div class="px-3 py-2.5 text-left flex justify-between items-center transition-colors cursor-pointer"
                                                     :class="age === selectedAge ? 'bg-zinc-50' : 'bg-white hover:bg-zinc-50'"
                                                     @click.self="toggleAccordion(domainKey, age)">
                                                    <div class="flex items-center gap-2 pointer-events-none">
                                                        <span class="text-sm font-semibold" :class="age === selectedAge ? 'text-zinc-900' : 'text-zinc-600'" x-text="age + ' 歲'"></span>
                                                        <span x-show="age === selectedAge" class="text-[10px] bg-zinc-800 text-white px-2 py-0.5 rounded-full font-medium tracking-wide">基準年齡</span>
                                                    </div>
                                                    <div class="flex items-center gap-3">
                                                        <div class="flex gap-1 items-center" x-show="isAccordionOpen(domainKey, age)">
                                                            <button @click.stop="setTargetItemAll(domainKey, age, 'pass')" title="本頁全達標" class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(O)</button>
                                                            <button @click.stop="setTargetItemAll(domainKey, age, 'nt')" title="本頁全未測" class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(-)</button>
                                                            <button @click.stop="setTargetItemAll(domainKey, age, 'fail')" title="本頁全未達" class="text-[11px] px-2 py-1 rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition">全(X)</button>
                                                        </div>
                                                        <button @click="toggleAccordion(domainKey, age)" class="p-1 hover:bg-black/5 rounded text-zinc-400">
                                                            <svg class="w-4 h-4 transition-transform duration-200" :class="isAccordionOpen(domainKey, age) ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                                        </button>
                                                    </div>
                                                </div>
                                                <div x-show="isAccordionOpen(domainKey, age)" x-collapse class="p-2 sm:p-3 bg-white space-y-1.5 sm:space-y-2 border-t border-zinc-100">
                                                    <template x-for="(item, index) in milestoneData[age][domainKey]" :key="index">
                                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-2 hover:bg-zinc-50 rounded-md transition-colors group">
                                                            <span class="text-sm text-zinc-700 font-medium group-hover:text-zinc-900 transition-colors flex-1" x-text="item"></span>
                                                            <div class="flex inline-flex rounded-md shadow-sm" role="group">
                                                                <button @click="setTargetItem(domainKey, age, item, 'pass')"
                                                                    class="px-3 sm:px-4 py-1.5 text-xs font-semibold rounded-l-md border border-zinc-200 transition-colors focus:z-10 focus:ring-1 focus:ring-zinc-800"
                                                                    :class="assessments[domainKey][age][item] === 'pass' ? 'bg-zinc-800 text-white border-zinc-800 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">達標 (O)</button>
                                                                <button @click="setTargetItem(domainKey, age, item, 'nt')"
                                                                    class="px-3 sm:px-4 py-1.5 text-xs font-semibold border-y border-zinc-200 transition-colors focus:z-10 focus:ring-1 focus:ring-zinc-800"
                                                                    :class="assessments[domainKey][age][item] === 'nt' ? 'bg-zinc-100 text-zinc-400 border-zinc-200 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">未測 (-)</button>
                                                                <button @click="setTargetItem(domainKey, age, item, 'fail')"
                                                                    class="px-3 sm:px-4 py-1.5 text-xs font-semibold rounded-r-md border border-zinc-200 transition-colors focus:z-10 focus:ring-1 focus:ring-zinc-800"
                                                                    :class="assessments[domainKey][age][item] === 'fail' ? 'bg-white text-zinc-900 border-zinc-800 ring-1 ring-inset ring-zinc-800 shadow-inner' : 'bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700'">未達 (X)</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                        <h2 class="text-lg font-semibold text-zinc-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                            1. 病歷 Objective 內容
                        </h2>
                        <button @click="copyText(getObjectiveReport(), 'btn1')" id="btn1"
                            class="text-sm px-3 py-1.5 bg-white border border-zinc-200 text-zinc-600 rounded-lg hover:bg-zinc-50 transition-colors flex items-center gap-1.5 shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            複製
                        </button>
                    </div>
                    <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-4 font-mono text-sm text-zinc-700 whitespace-pre-wrap h-64 overflow-y-auto"
                        x-text="getObjectiveReport()"></div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                        <h2 class="text-lg font-semibold text-zinc-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                </path>
                            </svg>
                            2. 聯合評估統合報告 (敘述型)
                        </h2>
                        <button @click="copyText(getSummaryReport(), 'btn2')" id="btn2"
                            class="text-sm px-3 py-1.5 bg-white border border-zinc-200 text-zinc-600 rounded-lg hover:bg-zinc-50 transition-colors flex items-center gap-1.5 shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            複製
                        </button>
                    </div>
                    <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-4 text-sm text-zinc-800 whitespace-pre-wrap min-h-[160px] leading-relaxed"
                        x-text="getSummaryReport()"></div>
                    <div class="mt-3 text-right">
                        <span class="text-[11px] font-medium px-2 py-1 rounded"
                            :class="getSummaryReport().length > 500 ? 'bg-red-50 text-red-600' : 'bg-transparent text-zinc-400'">
                            字數：<span x-text="getSummaryReport().length"></span> / 500
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const milestoneData = {
            "1": {
                gross: [
                    "拉著物體站起來",
                    "扶著家具側走(cruising)",
                    "牽著單手或雙手可走幾步",
                    "從坐姿拉站起來",
                    "獨立站立數秒"
                ],
                fine: [
                    "拍手",
                    "撕紙",
                    "食指拇指捏取小物(pincer grasp)",
                    "將小物放入杯中",
                    "粗略翻書(多頁一起翻)"
                ],
                lang: [
                    "揮手表示再見",
                    "模仿簡單的聲音",
                    "對名字有反應(叫他轉頭)",
                    "發出有意義單音(爸、媽)",
                    "了解簡單指令(如:給我)"
                ],
                social: [
                    "叫他，他來",
                    "參與玩躲貓貓",
                    "穿衣時配合伸出手臂",
                    "脫下簡單的帽子"
                ]
            },
            "1.5": {
                gross: [
                    "走得快",
                    "扶著欄杆走上樓梯",
                    "蹲下撿東西再站起",
                    "向後退走幾步",
                    "走路不太跌倒"
                ],
                fine: [
                    "用筆亂塗",
                    "重疊兩塊積木",
                    "轉開簡單瓶蓋",
                    "表現出慣用手傾向",
                    "用湯匙嘗試進食"
                ],
                lang: [
                    "有意義的叫爸爸、媽媽",
                    "主動說出一個單字",
                    "聽從簡單的一步指令",
                    "指出身體1-2個部位",
                    "用手指指向想要的東西"
                ],
                social: [
                    "端著杯子喝水",
                    "用湯匙喝東西",
                    "模仿大人做家事動作",
                    "穿衣時配合"
                ]
            },
            "2": {
                gross: [
                    "兩步一階上下樓梯",
                    "踢球",
                    "跑步",
                    "雙腳離地跳",
                    "爬上爬下椅子"
                ],
                fine: [
                    "一頁一頁翻書",
                    "模仿畫直線",
                    "疊6塊積木",
                    "將水從一杯倒到另一杯"
                ],
                lang: [
                    "至少說10個單字",
                    "指認身體的一部分",
                    "說出2個詞的短語",
                    "聽懂簡單的兩步指令",
                    "用語言表達需求"
                ],
                social: [
                    "脫去衣服",
                    "撥開糖果紙",
                    "進行平行遊戲(與同儕在旁各自玩)",
                    "表達不要(自主權)"
                ]
            },
            "2.5": {
                gross: [
                    "雙腳同時離地跳",
                    "沿直線走",
                    "手心朝下丟東西",
                    "踮腳尖走幾步"
                ],
                fine: [
                    "模仿別人摺紙",
                    "模仿畫圈",
                    "用線串大珠子",
                    "旋轉門把"
                ],
                lang: [
                    "命名至少身體六個部位",
                    "主動告知想上廁所",
                    "問這是什麼",
                    "使用簡單代名詞(我、你)",
                    "約一半語句可被理解"
                ],
                social: [
                    "穿脫沒有鞋帶的鞋子",
                    "用湯匙吃飯",
                    "洗手",
                    "對其他孩子有互動興趣"
                ]
            },
            "3": {
                gross: [
                    "騎三輪車",
                    "上樓梯(可交換腳)",
                    "跑得平穩",
                    "單腳站立1~2秒",
                    "雙腳跳過小障礙物",
                    "踮腳尖走"
                ],
                fine: [
                    "用三根手指握住筆",
                    "模仿畫圈",
                    "疊9塊積木",
                    "使用兒童剪刀剪紙",
                    "模仿畫十字"
                ],
                lang: [
                    "講自己的姓和名",
                    "說出自己的年紀和性別",
                    "說出短句(三個單字)",
                    "理解你的、我的",
                    "說出兩種物品用途",
                    "大部分語句可被理解"
                ],
                social: [
                    "穿衣服",
                    "上廁所",
                    "與同伴一起玩(輪流)",
                    "白天不尿褲子",
                    "與照顧者分離時不會劇烈哭鬧"
                ]
            },
            "4": {
                gross: [
                    "單腳連續跳5下(hopping)",
                    "單腳站5秒",
                    "下樓梯(可交換腳)",
                    "過肩投擲球",
                    "腳尖腳跟走",
                    "丟球(高過於頭)"
                ],
                fine: [
                    "畫十字與正方形",
                    "畫出2-3個部位的人像",
                    "作拇指對指動作",
                    "解開扣子"
                ],
                lang: [
                    "說出短句(四~五個單字)",
                    "數數(1-4)",
                    "辨認顏色",
                    "使用疑問句(誰、什麼、哪裡)",
                    "理解空間概念(裡外上下)"
                ],
                social: [
                    "穿襪子",
                    "刷牙",
                    "Imaginary play(扮家家酒)",
                    "懂得與同伴分享和合作",
                    "洗臉"
                ]
            },
            "5": {
                gross: [
                    "單腳站10秒",
                    "腳跟接腳尖走直線(tandem walk)",
                    "做小跳步(skipping)",
                    "步態成熟跳遠",
                    "靈活閃避障礙物"
                ],
                fine: [
                    "模仿畫三角形",
                    "接球",
                    "畫人(至少六個可辨識的部位)",
                    "熟練使用剪刀剪圖案",
                    "模仿寫出簡單文字/數字"
                ],
                lang: [
                    "數數(1-10)",
                    "說出句子(八~十個單字)",
                    "理解錢幣",
                    "流暢附誦5個數字",
                    "說明器官功能(眼睛看、嘴巴吃)",
                    "描述日常發生的事情"
                ],
                social: [
                    "獨立完成多數的個人盥洗",
                    "拉拉鍊、解扣子",
                    "遵守團體遊戲規則(捉迷藏)",
                    "表現出同理心",
                    "綁鞋帶"
                ]
            }
        };

        document.addEventListener('alpine:init', () => {
            Alpine.data('pedApp', () => ({
                ages: ["1", "1.5", "2", "2.5", "3", "4", "5"],
                selectedAge: "2",
                entryMethod: "自行走入診間",
                emotionState: "情緒及專注力可",

                domainNames: {
                    gross: "粗大動作 (Gross Motor)",
                    fine: "精細動作 (Fine Motor)",
                    lang: "語言溝通 (Speech & Language)",
                    social: "情緒互動及日常生活 (Social & Self-care)"
                },

                assessments: {},
                openAccordions: {},

                previousAge: "2",

                init() {
                    this.initChecklist();
                },

                onAgeChange() {
                    this.previousAge = this.selectedAge;
                    this.initChecklist(true);
                },

                initChecklist(forceReset = false) {
                    const isFirstInit = Object.keys(this.assessments).length === 0;
                    const shouldReset = isFirstInit || forceReset;

                    if (shouldReset) {
                        this.assessments = {};
                    }
                    this.openAccordions = {};

                    Object.keys(this.domainNames).forEach(domainKey => {
                        if (shouldReset) this.assessments[domainKey] = {};
                        this.openAccordions[domainKey] = {};
                        
                        this.ages.forEach(age => {
                            if (shouldReset) this.assessments[domainKey][age] = {};
                            this.openAccordions[domainKey][age] = (age === this.selectedAge);

                            const items = milestoneData[age][domainKey] || [];
                            items.forEach(item => {
                                if (shouldReset) {
                                    this.assessments[domainKey][age][item] = (age === this.selectedAge) ? 'pass' : 'nt';
                                }
                            });
                        });
                    });
                },

                toggleAccordion(domainKey, age) {
                    this.openAccordions[domainKey][age] = !this.openAccordions[domainKey][age];
                },

                isAccordionOpen(domainKey, age) {
                    return this.openAccordions[domainKey] && this.openAccordions[domainKey][age];
                },

                setTargetItem(domainKey, age, item, state) {
                    this.assessments[domainKey][age][item] = state;
                },

                setTargetItemAll(domainKey, age, state) {
                    const items = milestoneData[age][domainKey] || [];
                    items.forEach(item => {
                        this.assessments[domainKey][age][item] = state;
                    });
                },

                toggleAll() {
                    // Reset all items across all ages to "nt" (未測) 
                    // and set current age to "pass" to simulate a complete fresh start for the selected age
                    if(confirm("確定要清除所有評估紀錄，重置為未測狀態嗎？")) {
                        Object.keys(this.domainNames).forEach(domainKey => {
                            this.ages.forEach(age => {
                                const items = milestoneData[age][domainKey] || [];
                                items.forEach(item => {
                                    this.assessments[domainKey][age][item] = (age === this.selectedAge) ? 'pass' : 'nt';
                                });
                            });
                        });
                    }
                },

                getObjectiveReport() {
                    let p = `O:\n`;
                    p += `Entry: ${this.entryMethod}\n`;
                    p += `Mood/Attention: ${this.emotionState}\n\n`;
                    const printDomain = (engName, domainKey) => {
                        const passedSet = new Set();
                        const failedSet = new Set();
                        
                        this.ages.forEach(age => {
                            const items = milestoneData[age][domainKey] || [];
                            items.forEach(item => {
                                const state = this.assessments[domainKey][age][item];
                                if (state === 'pass') passedSet.add(item);
                                if (state === 'fail') failedSet.add(item);
                            });
                        });
                        
                        // Deduplication: Fail overrides Pass
                        failedSet.forEach(item => {
                            if (passedSet.has(item)) passedSet.delete(item);
                        });

                        let domainOutput = '';
                        passedSet.forEach(item => { domainOutput += `  ${item}:(O)\n`; });
                        failedSet.forEach(item => { domainOutput += `  ${item}:(X)\n`; });

                        if (domainOutput) {
                            p += `${engName}:\n${domainOutput}\n`;
                        } else {
                            p += `${engName}: Not tested\n\n`;
                        }
                    };
                    printDomain("Gross motor", "gross");
                    printDomain("Fine motor", "fine");
                    printDomain("Speech & language", "lang");
                    printDomain("Social interaction", "social");
                    return p.trim();
                },

                getSummaryReport() {
                    let parts = [];
                    parts.push(`該名 ${this.selectedAge} 歲孩童今日${this.entryMethod}，評估過程中${this.emotionState}。`);

                    const cannotPhrases = ['尚無法', '仍未能', '尚未出現', '還無法', '尚不會'];

                    const formatNarrative = (domainName, domainKey, verbCan) => {
                        // Gather all passed and failed items across all ages
                        const passedSet = new Set();
                        const failedSet = new Set();

                        this.ages.forEach(age => {
                            const items = milestoneData[age][domainKey] || [];
                            items.forEach(item => {
                                const state = this.assessments[domainKey][age][item];
                                if (state === 'pass') passedSet.add(item);
                                if (state === 'fail') failedSet.add(item);
                            });
                        });

                        // Deduplication: If an item is in failedSet, it must NOT be in passedSet
                        // This handles the overlap where a 2yo task is (O) but same 3yo task is (X)
                        failedSet.forEach(item => {
                            if (passedSet.has(item)) passedSet.delete(item);
                        });

                        const passed = Array.from(passedSet);
                        const failed = Array.from(failedSet);

                        if (passed.length === 0 && failed.length === 0) return '';

                        let line = `${domainName}方面：`;
                        
                        // If there are failures, we can't just say "all achieved"
                        if (failed.length === 0) {
                            if (passed.length > 0) {
                                line += `目前${verbCan}${passed.join('、')}。`;
                            } else {
                                line += `未測試。`;
                            }
                            return line;
                        }

                        if (passed.length > 0) {
                            line += `目前${verbCan}${passed.join('、')}`;
                        }
                        if (failed.length > 0) {
                            if (passed.length > 0) line += '；';
                            const failedParts = failed.map((item, idx) => {
                                const phrase = cannotPhrases[idx % cannotPhrases.length];
                                return `目前${phrase}${item}`;
                            });
                            line += failedParts.join('；');
                        }
                        line += '。';
                        return line;
                    };

                    const langDesc = formatNarrative('語言', 'lang', '可');
                    if (langDesc) parts.push(langDesc);

                    const grossDesc = formatNarrative('粗大動作', 'gross', '可');
                    if (grossDesc) parts.push(grossDesc);

                    const fineDesc = formatNarrative('精細動作', 'fine', '可');
                    if (fineDesc) parts.push(fineDesc);

                    const socialDesc = formatNarrative('情緒互動及日常生活', 'social', '可自己');
                    if (socialDesc) parts.push(socialDesc);

                    return parts.join('\n');
                },

                copyText(text, btnId) {
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = document.getElementById(btnId);
                        const originalText = btn.innerHTML;
                        btn.innerHTML = `<svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-700">已複製</span>`;
                        btn.classList.add('bg-green-50', 'border-green-200');
                        btn.classList.remove('bg-white', 'border-zinc-200');
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.classList.remove('bg-green-50', 'border-green-200');
                            btn.classList.add('bg-white', 'border-zinc-200');
                        }, 2000);
                    });
                }
            }));
        });
    </script>
</body>
