<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小兒發展里程碑快速評估</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 0.75rem;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto" x-data="pedApp()" x-cloak>
        <header class="mb-8 text-center flex flex-col items-center">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900">小兒發展里程碑快速評估</h1>
            <p class="text-slate-500 mt-2">Pediatric Milestone Assessment Tool</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Left Panel -->
            <div class="space-y-6">
                <div class="glass-panel p-6">
                    <h2 class="text-lg font-semibold mb-4 text-blue-700 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        基本狀態評估
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">評估年齡</label>
                            <select x-model="selectedAge" @change="initChecklist()"
                                class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white p-2 border">
                                <template x-for="age in ages" :key="age">
                                    <option :value="age" x-text="age + ' 歲'"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">進入診間方式</label>
                            <select x-model="entryMethod"
                                class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white p-2 border">
                                <option value="自行走入診間">自行走入診間</option>
                                <option value="由父母抱入診間">由父母抱入診間</option>
                                <option value="坐推車進入診間">坐推車進入診間</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">情緒與專注力</label>
                            <select x-model="emotionState"
                                class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white p-2 border">
                                <option value="情緒及專注力可">情緒及專注力可</option>
                                <option value="易分心">易分心</option>
                                <option value="情緒及專注力佳">情緒及專注力佳</option>
                                <option value="哭鬧難安撫">哭鬧難安撫</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-6 flex-1">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-blue-700 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                                </path>
                            </svg>
                            發展指標勾選
                        </h2>
                        <button @click="toggleAll()"
                            class="text-sm px-3 py-1 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 transition-colors">
                            全選 / 全不選
                        </button>
                    </div>
                    <div class="space-y-6 max-h-[500px] overflow-y-auto pr-2">
                        <template x-for="(domainName, domainKey) in domainNames" :key="domainKey">
                            <div class="bg-white rounded-lg p-4 shadow-sm border border-slate-100">
                                <div class="flex justify-between items-center mb-3 border-b pb-2">
                                    <h3 class="font-medium text-slate-800" x-text="domainName"></h3>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
                                        :class="checklist[domainKey].length === getCurrentItems(domainKey).length ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'"
                                        x-text="checklist[domainKey].length + ' / ' + getCurrentItems(domainKey).length"></span>
                                </div>
                                <div class="space-y-2">
                                    <template x-for="(item, index) in getCurrentItems(domainKey)" :key="index">
                                        <label class="flex items-start space-x-3 cursor-pointer group">
                                            <div class="flex-shrink-0 pt-0.5">
                                                <input type="checkbox" :value="item" x-model="checklist[domainKey]"
                                                    class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 transition-all cursor-pointer">
                                            </div>
                                            <span class="text-slate-600 group-hover:text-slate-900 transition-colors"
                                                x-text="item"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="space-y-6">
                <div class="glass-panel p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-green-700 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                            1. 病歷 Objective 內容
                        </h2>
                        <button @click="copyText(getObjectiveReport(), 'btn1')" id="btn1"
                            class="text-sm px-3 py-1 bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            複製
                        </button>
                    </div>
                    <div class="bg-white border border-slate-200 rounded p-4 font-mono text-sm text-slate-700 whitespace-pre-wrap h-64 overflow-y-auto"
                        x-text="getObjectiveReport()"></div>
                </div>

                <div class="glass-panel p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-purple-700 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                </path>
                            </svg>
                            2. 聯合評估統合報告 (敘述型)
                        </h2>
                        <button @click="copyText(getSummaryReport(), 'btn2')" id="btn2"
                            class="text-sm px-3 py-1 bg-purple-100 text-purple-700 rounded-full hover:bg-purple-200 transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            複製
                        </button>
                    </div>
                    <div class="bg-white border border-slate-200 rounded p-4 text-sm text-slate-700 whitespace-pre-wrap min-h-[160px]"
                        x-text="getSummaryReport()"></div>
                    <div class="mt-2 text-right">
                        <span class="text-xs font-medium px-2 py-1 rounded"
                            :class="getSummaryReport().length > 500 ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-500'">
                            字數：<span x-text="getSummaryReport().length"></span> / 500
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const milestoneData = {
            "1": {
                gross: [
                    "拉著物體自己站起來",
                    "雙手扶著家具會走幾步",
                    "扶著可側走(cruising)",
                    "能從坐姿拉站起來",
                    "可獨立站立數秒"
                ],
                fine: [
                    "拍手",
                    "撕紙",
                    "食指拇指捏取小物(pincer grasp)",
                    "將小物放入杯中",
                    "粗略翻書(多頁一起翻)"
                ],
                lang: [
                    "揮手表示再見",
                    "會模仿簡單的聲音",
                    "對自己名字有反應(叫他會轉頭)",
                    "發出有意義的單音(爸、媽)",
                    "了解簡單指令(如:給我)"
                ],
                social: [
                    "叫他，他會來",
                    "會玩躲貓貓",
                    "穿衣時配合伸出手臂",
                    "會脫下簡單的帽子"
                ]
            },
            "1.5": {
                gross: [
                    "可以走得很快",
                    "扶著欄杆可以走上樓梯",
                    "能蹲下撿東西再站起",
                    "能向後退走幾步",
                    "走路不太會跌倒"
                ],
                fine: [
                    "會用筆亂塗",
                    "重疊兩塊積木",
                    "能轉開簡單瓶蓋",
                    "開始出現慣用手傾向",
                    "能用湯匙嘗試進食(會灑)"
                ],
                lang: [
                    "有意義的叫爸爸、媽媽",
                    "會主動說出一個單字",
                    "能聽從簡單的一步指令",
                    "能指出身體1-2個部位",
                    "會用手指指向想要的東西"
                ],
                social: [
                    "會雙手端著杯子喝水",
                    "會用湯匙喝東西",
                    "會模仿大人做家事動作",
                    "穿衣時能配合"
                ]
            },
            "2": {
                gross: [
                    "會自己上下樓梯",
                    "會踢球",
                    "跑得好",
                    "能雙腳離地跳(預兆)",
                    "能爬上爬下椅子"
                ],
                fine: [
                    "會一頁一頁翻書",
                    "重疊兩塊積木",
                    "會模仿畫直線",
                    "能疊6塊積木",
                    "能將水從一杯倒到另一杯"
                ],
                lang: [
                    "至少會說10個單字",
                    "會指認身體的一部分",
                    "能說出2個詞的短語",
                    "聽懂簡單的兩步指令",
                    "能用語言表達需求"
                ],
                social: [
                    "自己會脫去衣服",
                    "能自行撥開糖果紙",
                    "開始出現平行遊戲",
                    "會表達不要(自主權)"
                ]
            },
            "2.5": {
                gross: [
                    "雙腳同時離地跳",
                    "能沿直線走",
                    "能手心朝下丟東西",
                    "能踮腳尖走幾步"
                ],
                fine: [
                    "能模仿別人摺紙",
                    "會模仿畫圈",
                    "能模仿畫直線",
                    "能用線串大珠子",
                    "能旋轉門把"
                ],
                lang: [
                    "會命名至少身體六個部位",
                    "會主動告知想上廁所",
                    "會問這是什麼",
                    "能使用簡單代名詞(我、你)",
                    "約一半語句可被理解"
                ],
                social: [
                    "會穿脫沒有鞋帶的鞋子",
                    "會用湯匙吃飯(較少灑)",
                    "能自己洗手",
                    "開始對其他孩子有互動興趣"
                ]
            },
            "3": {
                gross: [
                    "會騎三輪車",
                    "上樓梯(可交換腳)",
                    "跑得好",
                    "單腳跳一下",
                    "能雙腳跳過小障礙物",
                    "踮腳尖走路"
                ],
                fine: [
                    "會用三根手指握住筆",
                    "會模仿畫圈",
                    "能疊9塊積木",
                    "能使用兒童剪刀剪紙",
                    "能模仿畫十字(預兆)"
                ],
                lang: [
                    "會講自己的姓和名",
                    "知道年紀和性別",
                    "說出短句(三個單字)",
                    "能理解你的、我的",
                    "能說出兩種物品用途",
                    "大部分語句可被理解"
                ],
                social: [
                    "會自己穿衣服",
                    "會自己上廁所",
                    "能與同伴一起玩(輪流)",
                    "白天不尿褲子",
                    "與照顧者分離時不會劇烈哭鬧"
                ]
            },
            "4": {
                gross: [
                    "單腳跳",
                    "單腳站5秒",
                    "下樓梯(可交換腳)",
                    "能單腳連續跳5下(hopping)",
                    "能過肩投擲球",
                    "腳尖腳跟走",
                    "會丟球(高過於頭)"
                ],
                fine: [
                    "自己畫圓和正方形",
                    "能模仿畫十字(+)",
                    "能畫出2-3個部位的人像",
                    "能做拇指對指動作",
                    "能自行解開扣子"
                ],
                lang: [
                    "說出短句(四~五個單字)",
                    "會數數(1-4)",
                    "會辨認顏色",
                    "會使用疑問句(誰、什麼、哪裡)",
                    "能理解空間概念(裡外上下)",
                    "能說出自己的性別"
                ],
                social: [
                    "會自己穿襪子",
                    "會自己刷牙",
                    "Imaginary play(扮家家酒)",
                    "懂得與同伴分享和合作",
                    "能自己洗臉"
                ]
            },
            "5": {
                gross: [
                    "單腳站10秒",
                    "能腳跟接腳尖走直線(tandem walk)",
                    "能做小跳步(skipping)",
                    "步態成熟，能跳遠",
                    "能靈活閃避障礙物"
                ],
                fine: [
                    "會模仿畫三角形",
                    "會接球",
                    "會畫人(至少有六個可辨識的部位)",
                    "能熟練使用剪刀剪圖案",
                    "能模仿寫出簡單文字/數字"
                ],
                lang: [
                    "會數數(1-10)",
                    "說出句子(八~十個單字)",
                    "理解錢幣",
                    "能流暢附誦5個數字",
                    "能說明器官功能(眼睛看、嘴巴吃)",
                    "能描述日常發生的事情"
                ],
                social: [
                    "能獨立完成多數的個人盥洗",
                    "會拉拉鍊、解扣子",
                    "能遵守團體遊戲規則(捉迷藏)",
                    "能表現出同理心",
                    "能綁鞋帶(預兆)"
                ]
            }
        };

        document.addEventListener('alpine:init', () => {
            Alpine.data('pedApp', () => ({
                ages: ["1", "1.5", "2", "2.5", "3", "4", "5"],
                selectedAge: "2",
                entryMethod: "自行走入診間",
                emotionState: "情緒及專注力可",

                domainNames: {
                    gross: "粗大動作 (Gross Motor)",
                    fine: "精細動作 (Fine Motor)",
                    lang: "語言溝通 (Speech & Language)",
                    social: "情緒互動及日常生活 (Social & Self-care)"
                },

                checklist: { gross: [], fine: [], lang: [], social: [] },

                init() { this.initChecklist(); },

                getCurrentItems(domainKey) {
                    return milestoneData[this.selectedAge][domainKey] || [];
                },

                initChecklist() {
                    Object.keys(this.checklist).forEach(domain => {
                        this.checklist[domain] = [...this.getCurrentItems(domain)];
                    });
                },

                toggleAll() {
                    const domainKeys = Object.keys(this.checklist);
                    let isAllChecked = true;
                    for (let k of domainKeys) {
                        if (this.checklist[k].length !== this.getCurrentItems(k).length) {
                            isAllChecked = false;
                            break;
                        }
                    }
                    if (isAllChecked) {
                        domainKeys.forEach(k => this.checklist[k] = []);
                    } else {
                        domainKeys.forEach(k => this.checklist[k] = [...this.getCurrentItems(k)]);
                    }
                },

                getObjectiveReport() {
                    let p = `O:\n`;
                    p += `Entry: ${this.entryMethod}\n`;
                    p += `Mood/Attention: ${this.emotionState}\n\n`;
                    const printDomain = (engName, domainKey) => {
                        const allItems = this.getCurrentItems(domainKey);
                        const checkedSet = new Set(this.checklist[domainKey]);
                        const passCount = allItems.filter(i => checkedSet.has(i)).length;
                        p += `${engName} (${passCount}/${allItems.length}):\n`;
                        allItems.forEach(item => {
                            const status = checkedSet.has(item) ? '(O)' : '(X)';
                            p += `${item}:${status}\n`;
                        });
                        p += '\n';
                    };
                    printDomain("Gross motor", "gross");
                    printDomain("Fine motor", "fine");
                    printDomain("Speech & language", "lang");
                    printDomain("Social interaction", "social");
                    return p.trim();
                },

                getSummaryReport() {
                    let parts = [];
                    parts.push(`該名 ${this.selectedAge} 歲孩童今日${this.entryMethod}，評估過程中${this.emotionState}。`);

                    const cannotPhrases = ['尚無法', '仍未能', '尚未出現', '還無法', '尚不會'];

                    const formatNarrative = (domainName, domainKey, verbCan) => {
                        const allItems = this.getCurrentItems(domainKey);
                        const checkedSet = new Set(this.checklist[domainKey]);
                        const passed = allItems.filter(i => checkedSet.has(i));
                        const failed = allItems.filter(i => !checkedSet.has(i));

                        if (passed.length === 0 && failed.length === 0) return '';

                        let line = `${domainName}方面：`;
                        if (failed.length === 0) {
                            line += `${this.selectedAge}歲各項指標均已達成。`;
                            return line;
                        }
                        if (passed.length > 0) {
                            line += `目前${verbCan}${passed.join('、')}`;
                        }
                        if (failed.length > 0) {
                            if (passed.length > 0) line += '；';
                            const failedParts = failed.map((item, idx) => {
                                const phrase = cannotPhrases[idx % cannotPhrases.length];
                                return `目前${phrase}${item}`;
                            });
                            line += failedParts.join('；');
                        }
                        line += '。';
                        return line;
                    };

                    const langDesc = formatNarrative('語言', 'lang', '可');
                    if (langDesc) parts.push(langDesc);

                    const grossDesc = formatNarrative('粗大動作', 'gross', '可');
                    if (grossDesc) parts.push(grossDesc);

                    const fineDesc = formatNarrative('精細動作', 'fine', '可');
                    if (fineDesc) parts.push(fineDesc);

                    const socialDesc = formatNarrative('情緒互動及日常生活', 'social', '可自己');
                    if (socialDesc) parts.push(socialDesc);

                    return parts.join('\n');
                },

                copyText(text, btnId) {
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = document.getElementById(btnId);
                        const originalText = btn.innerHTML;
                        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 已複製`;
                        btn.classList.add('bg-gray-200', 'text-gray-800');
                        btn.classList.remove('bg-green-100', 'text-green-700', 'bg-purple-100', 'text-purple-700');
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.classList.remove('bg-gray-200', 'text-gray-800');
                            if (btnId === 'btn1') btn.classList.add('bg-green-100', 'text-green-700');
                            if (btnId === 'btn2') btn.classList.add('bg-purple-100', 'text-purple-700');
                        }, 2000);
                    });
                }
            }));
        });
    </script>
</body>

</html>
